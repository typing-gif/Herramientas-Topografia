<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpolación de Curvas a Mano</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        /* === NUEVA SEGURIDAD: Prevenir selección de texto === */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Reseteo básico (Código original intacto) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #d1d8e0;
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: 'Patrick Hand', cursive;
            color: #0f1b61;
            font-size: 22px;
        }

        /* Estilo de la hoja de papel 8.5 x 11 pulgadas */
        .hoja-papel {
            width: 8.5in;
            min-height: 11in;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-image: 
                linear-gradient(90deg, transparent 79px, #ff9999 79px, #ff9999 81px, transparent 81px),
                repeating-linear-gradient(transparent, transparent 29px, #99ccff 29px, #99ccff 30px);
            background-size: auto, 100% 30px;
            padding: 30px 40px 30px 100px;
            line-height: 30px; /* Vital para cuadrar en los renglones */
            position: relative;
        }

        h1 {
            font-size: 30px;
            text-align: center;
            margin-bottom: 30px;
            line-height: 30px;
            font-weight: normal;
            text-decoration: underline;
        }

        .datos-ingreso {
            margin-bottom: 30px;
        }

        .linea-texto {
            display: flex;
            align-items: baseline;
            height: 30px;
        }

        input[type="number"] {
            font-family: 'Patrick Hand', cursive;
            font-size: 22px;
            color: #0f1b61;
            border: none;
            background: transparent;
            border-bottom: 2px dashed #0f1b61;
            width: 80px;
            text-align: center;
            margin: 0 10px;
            outline: none;
        }

        input[type="text"].input-nombre {
            font-family: 'Patrick Hand', cursive;
            font-size: 22px;
            color: #0f1b61;
            border: none;
            background: transparent;
            border-bottom: 2px dashed #0f1b61;
            width: 50px;
            text-align: center;
            margin: 0 5px;
            outline: none;
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .acciones {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        .btn-texto {
            background: transparent;
            border: none;
            font-family: 'Patrick Hand', cursive;
            font-size: 22px;
            color: #b33939;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
        }

        .btn-texto:hover {
            color: #ff5252;
        }

        #mensajeError {
            color: #b33939;
            display: none;
        }

        #resultados {
            margin-top: 30px;
            display: none;
        }

        .fraccion {
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            height: 60px; 
            vertical-align: middle;
            margin: 0 10px;
        }

        .fraccion span {
            height: 30px;
            line-height: 30px;
        }

        .fraccion span:first-child {
            border-bottom: 2px solid #0f1b61;
        }

        sub {
            vertical-align: baseline;
            position: relative;
            top: 0.4em;
            font-size: 0.8em;
            line-height: 0;
        }

        .resaltado {
            border: 1px solid #0f1b61;
            border-radius: 50% 10% 50% 10% / 10% 50% 10% 50%;
            padding: 0 5px;
        }

        /* AJUSTES DE IMPRESIÓN DEFINITIVOS */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            @page {
                size: letter; /* Fuerza el tamaño carta 8.5 x 11 */
                margin: 0;
            }
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background-color: white !important;
                background-image: 
                    linear-gradient(90deg, transparent 79px, #ff9999 79px, #ff9999 81px, transparent 81px),
                    repeating-linear-gradient(transparent, transparent 29px, #99ccff 29px, #99ccff 30px) !important;
                background-size: auto, 100% 30px !important;
            }
            .hoja-papel {
                box-shadow: none;
                width: 8.5in;
                margin: 0 auto;
                padding: 30px 40px 30px 100px;
                background: transparent !important;
            }
            .no-imprimir {
                display: none !important;
            }
            input[type="number"], input[type="text"].input-nombre {
                border-bottom: none;
            }
            .paso {
                page-break-inside: avoid;
            }
            div {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body oncontextmenu="return false"> <!-- === NUEVA SEGURIDAD: Bloqueo de clic derecho === -->

    <div class="hoja-papel">
        <h1>Interpolación de Curvas de Nivel</h1>

        <div class="datos-ingreso">
            <div class="linea-texto">
                Datos iniciales:
            </div>
            <div class="linea-texto">
                Cota <input type="text" id="nombre1" class="input-nombre" value="A1" placeholder="Ej: A3"> = <input type="number" id="cota1" step="0.01" placeholder="Ej: 99.23">
            </div>
            <div class="linea-texto">
                Cota <input type="text" id="nombre2" class="input-nombre" value="A2" placeholder="Ej: C1"> = <input type="number" id="cota2" step="0.01" placeholder="Ej: 98.60">
            </div>
            <div class="linea-texto">
                Equidistancia = <input type="number" id="equidistancia" step="0.001" value="0.25"> m
            </div>
            <div class="linea-texto">
                Distancia en el plano = <input type="number" id="distancia" step="0.01" value="10"> cm
            </div>
        </div>

        <div id="mensajeError" class="linea-texto"></div>

        <div class="acciones no-imprimir">
            <button class="btn-texto" onclick="calcular()">-> Calcular pasos <-</button>
            <button class="btn-texto" onclick="limpiar()">[ Borrar hoja ]</button>
            <button class="btn-texto" onclick="window.print()">[ Imprimir hoja ]</button>
        </div>

        <div id="resultados">
        </div>
    </div>

    <script>
        // === NUEVA SEGURIDAD: Bloqueo de atajos de teclado ===
        document.addEventListener('keydown', function(e) {
            // Bloquea F12, Ctrl+U (Ver código), Ctrl+S (Guardar), Ctrl+C (Copiar) y Ctrl+Shift+I (Consola)
            if (e.key === 'F12' || 
               (e.ctrlKey && e.key === 'u') || 
               (e.ctrlKey && e.key === 'U') || 
               (e.ctrlKey && e.key === 's') || 
               (e.ctrlKey && e.key === 'S') || 
               (e.ctrlKey && e.key === 'c') || 
               (e.ctrlKey && e.key === 'C') || 
               (e.ctrlKey && e.shiftKey && e.key === 'i') || 
               (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
        });

        // =========================================================
        // === CÓDIGO ORIGINAL INTACTO A PARTIR DE ESTE PUNTO ===
        // =========================================================

        function calcular() {
            const nombre1 = document.getElementById('nombre1').value.trim() || 'A1';
            const nombre2 = document.getElementById('nombre2').value.trim() || 'A2';

            const cota1 = parseFloat(document.getElementById('cota1').value);
            const cota2 = parseFloat(document.getElementById('cota2').value);
            const equidistancia = parseFloat(document.getElementById('equidistancia').value);
            const distancia = parseFloat(document.getElementById('distancia').value);
            const errorMsg = document.getElementById('mensajeError');

            if (isNaN(cota1) || isNaN(cota2) || isNaN(equidistancia) || isNaN(distancia)) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Ojo: Faltan datos o hay letras cruzadas.';
                return;
            }
            if (cota1 === cota2) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Ojo: Las cotas no pueden ser idénticas.';
                return;
            }
            if (equidistancia <= 0) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Ojo: La equidistancia debe ser positiva.';
                return;
            }
            
            errorMsg.style.display = 'none';

            const cotaMayor = Math.max(cota1, cota2);
            const cotaMenor = Math.min(cota1, cota2);
            const diferenciaTotal = Math.abs(cota1 - cota2);
            const numIntervalos = diferenciaTotal / equidistancia;

            const curvasNivel = [];
            let primeraCurva = Math.floor(cotaMayor / equidistancia) * equidistancia;
            if (primeraCurva === cotaMayor) primeraCurva -= equidistancia;
            
            let curvaActual = primeraCurva;
            while (curvaActual > cotaMenor) {
                curvasNivel.push(curvaActual);
                curvaActual -= equidistancia;
            }

            const diferencias = curvasNivel.map(curva => cotaMayor - curva);
            const distancias = diferencias.map(diff => (diff * distancia) / diferenciaTotal);

            let html = '';

            html += `<div class="paso">1) Cota ${nombre1} = ${cota1.toFixed(2)} - Cota ${nombre2} = ${cota2.toFixed(2)} = ${diferenciaTotal.toFixed(2)} mdv</div>`;
            html += `<br>`; 

            html += `<div class="paso">2) 
                        <div class="fraccion">
                            <span>${diferenciaTotal.toFixed(2)} mdv</span>
                            <span>${equidistancia.toFixed(3)} m</span>
                        </div> 
                        = ${numIntervalos.toFixed(2)} posibles cotas
                     </div>`;
            html += `<br>`; 

            if (curvasNivel.length === 0) {
                html += `<div class="paso">No hay curvas intermedias para calcular.</div>`;
            } else {
                const curvasStr = curvasNivel.map(c => c.toFixed(2)).join(', ');
                html += `<div class="paso">3) ${curvasStr}</div>`;
                html += `<br>`;

                html += `<div class="paso">4) ${cotaMayor.toFixed(2)} - ${curvasNivel[0].toFixed(2)} = ${diferencias[0].toFixed(2)} mdv</div>`;
                for(let i = 1; i < diferencias.length; i++) {
                    html += `<div>&nbsp;&nbsp;&nbsp;${cotaMayor.toFixed(2)} - ${curvasNivel[i].toFixed(2)} = ${diferencias[i].toFixed(2)} mdv</div>`;
                }
                html += `<br>`;

                html += `<div class="paso">5) ${diferenciaTotal.toFixed(2)} mdv &rarr; ${distancia} cm</div>`;
                html += `<div>&nbsp;&nbsp;&nbsp;${diferencias[0].toFixed(2)} mdv &rarr; X<sub>1</sub></div>`;
                html += `<br>`;
                for (let i = 1; i < diferencias.length; i++) {
                    html += `<div>&nbsp;&nbsp;&nbsp;${diferenciaTotal.toFixed(2)} mdv &rarr; ${distancia} cm</div>`;
                    html += `<div>&nbsp;&nbsp;&nbsp;${diferencias[i].toFixed(2)} mdv &rarr; X<sub>${i+1}</sub></div>`;
                    html += `<br>`;
                }

                html += `<div class="paso">6)</div>`;
                distancias.forEach((dist, i) => {
                    html += `<div style="display: flex; height: 60px; align-items: center;">
                                <div>X<sub>${i+1}</sub> = </div>
                                <div class="fraccion">
                                    <span>${diferencias[i].toFixed(2)} mdv x ${distancia} cm</span>
                                    <span>${diferenciaTotal.toFixed(2)} mdv</span>
                                </div>
                                <div>= <span class="resaltado">${dist.toFixed(2)} cm</span></div>
                             </div>`;
                    html += `<br>`;
                });
            }

            document.getElementById('resultados').innerHTML = html;
            document.getElementById('resultados').style.display = 'block';
        }

        function limpiar() {
            document.getElementById('nombre1').value = 'A1';
            document.getElementById('nombre2').value = 'A2';
            document.getElementById('cota1').value = '';
            document.getElementById('cota2').value = '';
            document.getElementById('equidistancia').value = '0.25';
            document.getElementById('distancia').value = '10';
            document.getElementById('resultados').style.display = 'none';
            document.getElementById('mensajeError').style.display = 'none';
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') calcular();
            });
        });
    </script>
</body>
</html>
